[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audioknigi-downloader"
dynamic = ["version"]
description = "Accessible Qt audiobook downloader and library manager for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "requests",
  "playwright",
  "Pillow",
  "mutagen",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[tool.setuptools.dynamic]
version = {attr = "audioknigi.version.__version__"}

[tool.setuptools.packages.find]
include = ["audioknigi*"]

[tool.setuptools.package-data]
audioknigi = ["locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
