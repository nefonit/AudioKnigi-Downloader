name: Export Round56 Source

on:
  push:
    branches:
      - round56-qt-lifecycle
    paths:
      - .github/workflows/export-round56.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Create Round 56 source archive
        run: |
          git archive --format=zip \
            --prefix=AudioKnigi-Downloader-4.12.42-Round56/ \
            -o AudioKnigi-Downloader-4.12.42-Round56.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: round56-source
          path: AudioKnigi-Downloader-4.12.42-Round56.zip
          if-no-files-found: error
          retention-days: 1
