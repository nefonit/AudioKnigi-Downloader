name: Export Round57 Source

on:
  push:
    branches:
      - round57-selftest-finally
    paths:
      - .github/workflows/export-round57.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Create Round 57 source archive
        run: |
          git archive --format=zip \
            --prefix=AudioKnigi-Downloader-4.12.42-Round57/ \
            -o AudioKnigi-Downloader-4.12.42-Round57.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: round57-source
          path: AudioKnigi-Downloader-4.12.42-Round57.zip
          if-no-files-found: error
          retention-days: 1
