name: Apply Round 21 CI follow-up

on:
  push:
    branches: ["round21-ready"]
    paths:
      - ".round21-ci-fix.patch"
      - ".github/workflows/apply-round21-ci-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply verified CI follow-up
        shell: bash
        run: |
          git apply --index --check .round21-ci-fix.patch
          git apply --index .round21-ci-fix.patch
          git rm .round21-ci-fix.patch .github/workflows/apply-round21-ci-fix.yml
          git diff --cached --check
      - name: Verify focused contracts
        shell: bash
        run: |
          python tools/undefined_global_audit.py
          python -m pytest -q tests/integration/test_report_followup_round21_20260917.py
      - name: Commit CI follow-up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Windows CI compatibility for Round 21"
          git push origin HEAD:round21-ready
